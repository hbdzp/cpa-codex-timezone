name: Release

# Pushing a tag such as v0.2.0 builds every platform and publishes a GitHub
# Release whose assets follow the CPA plugin store layout:
#   codex-timezone_<version>_<goos>_<goarch>.zip + checksums.txt
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  REPOSITORY: https://github.com/${{ github.repository }}

jobs:
  linux:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # Debian bookworm matches the official CPA Docker image, so the library
    # only needs the glibc that image ships.
    container: golang:1.26-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: apt-get update && apt-get install -y --no-install-recommends python3
      - run: scripts/release/package.sh "${TAG#v}" "$REPOSITORY"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.runner }}
          path: dist/*.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          GOARCH=arm64 CC="clang -arch arm64" scripts/release/package.sh "${TAG#v}" "$REPOSITORY"
          GOARCH=amd64 CC="clang -arch x86_64" scripts/release/package.sh "${TAG#v}" "$REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*.zip

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/release/package.sh "${TAG#v}" "$REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*.zip

  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: python3 scripts/release/checksums.py dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/checksums.txt --clobber
          else
            gh release create "$TAG" dist/*.zip dist/checksums.txt --title "$TAG" --generate-notes
          fi
